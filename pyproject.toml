
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacenters"
version = "0.1.0"
description = "Replication of Cai et al. (2023)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "pyreadr",
    "scipy",
    "pyarrow",
    "matplotlib",
]

[project.optional-dependencies]
projection = [
    "statsmodels",   # optional exact-ML ARIMA cross-check
]
dev = [
    "pytest",
    "black",
    "ruff",
    "ipykernel",
]
gtap = [
    "gamsapi[core]==51.3.0",
]
all = [
    "pytest",
    "black",
    "ruff",
    "ipykernel",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = [
    "gtap_testing",
    "global_datacentre_icio_model",
    "global_datacentre_icio_model_v2",
    "canada_dsut_split",
    "tiva_ghg_indicators",
    "estimate_canada_cloud_share",
    "project_icio",
    "dc_origin_override",
    "build_aea_crosswalk",
    "build_aea_emission_weights",
    "summarize_results",
    "ewaste",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = [
    "GDX12_23*",
    "Documentation*",
    "tests*",
    "*.egg-info*",
]
